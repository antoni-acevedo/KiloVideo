name: kilovideo
description: "Compresor de video para Linux, con menu contextual."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  test: ^1.31.0
  file_selector: ^1.0.3
  desktop_drop: ^0.4.4
  cross_file: ^0.3.4+2
  window_manager: ^0.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/linux/kilovideo.desktop
    - assets/linux/scripts/KiloVideo
